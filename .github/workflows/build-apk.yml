name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: beevelop/cordova:v2022.05.1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build APK via Cordova
        run: |
          mkdir -p /tmp/cordova_app
          cd /tmp/cordova_app
          cordova create myapp com.neonpulse.game NeonPulse
          cd myapp
          cordova platform add android
          rm -rf www/*
          cp -r $GITHUB_WORKSPACE/* www/
          cordova build android --no-telemetry
          mkdir -p $GITHUB_WORKSPACE/output
          cp platforms/android/app/build/outputs/apk/debug/app-debug.apk $GITHUB_WORKSPACE/output/NeonPulse-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeonPulse-APK
          path: output/NeonPulse-debug.apk
